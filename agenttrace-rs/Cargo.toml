[package]
name = "agenttrace-rs"
version = "0.1.0"
edition = "2021"
description = "Zero-bloat W3C distributed tracing & trajectory telemetry for autonomous AI agents in Rust"
license = "MIT"
authors = ["AgentTrace Core Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "agenttrace"
path = "src/main.rs"

[lib]
name = "agenttrace"
path = "src/lib.rs"
